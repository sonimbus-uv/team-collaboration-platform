name: team-collaboration-platform

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-team_collaboration}
      POSTGRES_USER: ${POSTGRES_USER:-team_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # Esquema y usuario por servicio (D-13, T-04). Se ejecuta en cada `up`,
  # es idempotente y termina; también aplica a volúmenes ya existentes.
  postgres-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-team_collaboration}
      PGUSER: ${POSTGRES_USER:-team_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_this_postgres_password}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Define AUTH_DB_PASSWORD en infrastructure/.env}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD:?Define CORE_DB_PASSWORD en infrastructure/.env}
      FILES_DB_PASSWORD: ${FILES_DB_PASSWORD:?Define FILES_DB_PASSWORD en infrastructure/.env}
      REPORTS_DB_PASSWORD: ${REPORTS_DB_PASSWORD:?Define REPORTS_DB_PASSWORD en infrastructure/.env}
    command: ["sh", "/database/init.sh"]
    volumes:
      - type: bind
        source: ../database/postgres
        target: /database
        read_only: true
        bind:
          create_host_path: false
    networks:
      - backend

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_this_redis_password}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-change_this_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ../gateway/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../gateway/nginx/services
        target: /etc/nginx/services
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../gateway/nginx/routes
        target: /etc/nginx/routes
        read_only: true
        bind:
          create_host_path: false
    networks:
      auth_gateway:
        ipv4_address: 172.30.250.2
  # Mensajes y reacciones de Core (D-05, T-01). Un nodo con memoria acotada.
  scylladb:
    image: scylladb/scylla:${SCYLLA_VERSION:-2026.3.4}
    profiles:
      - messaging
    restart: unless-stopped
    command:
      - --smp
      - "${SCYLLA_SMP:-1}"
      - --memory
      - "${SCYLLA_MEMORY:-750M}"
      # Sin esto, Seastar aparta 1.5 GiB para el sistema y deja solo 500 MB,
      # menos que SCYLLA_MEMORY. Además descuenta unos 120 MB del límite del
      # contenedor; por eso SCYLLA_MEM_LIMIT es 1200m y no 1g.
      - --reserve-memory
      - "${SCYLLA_RESERVE_MEMORY:-250M}"
      - --overprovisioned
      - "1"
      - --developer-mode
      - "1"
    ports:
      - "${SCYLLA_PORT:-9042}:9042"
    volumes:
      - scylla_data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    mem_limit: ${SCYLLA_MEM_LIMIT:-1200m}
    networks:
      - backend

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles:
      - storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_this_minio_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  # Bucket de archivos (T-05). Idempotente; termina al crearlo o si ya existe.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles:
      - storage
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_this_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-sonimbus-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
    networks:
      - backend

networks:
  backend:
    driver: bridge

  auth_gateway:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-auth
    ipam:
      config:
        - subnet: 172.30.250.0/29
          gateway: 172.30.250.1

volumes:
  postgres_data:
  redis_data:
  scylla_data:
  minio_data: