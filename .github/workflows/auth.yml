name: Auth

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/auth_test
      REDIS_URL: redis://127.0.0.1:6379/0
      AUTH_RECIPIENT_HMAC_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prepare test configuration
        run: cp .env.example .env
      - name: Check formatting
        run: cargo fmt --check
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Clippy
        run: |
          cargo clippy --lib --locked -- -D warnings
          cargo clippy --all-targets --locked
      - name: Run all tests including Redis tests
        run: cargo test --locked -- --include-ignored
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nginx for isolated gateway test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nginx
      - name: Check public JWKS routing and existing budgets
        run: python3 scripts/test-auth-jwks-gateway.py --nginx /usr/sbin/nginx
