<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sonimbus · Recuperar contraseña, paso 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1A1A1A}a:hover{color:#000000}
button{font-family:inherit}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1A1A1A; background: #FFFFFF; border: 2px solid #1A1A1A; overflow: hidden">

  <!-- Barra de título de la ventana -->
  <div style="height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 0 0 12px; background: #D9D9D9; border-bottom: 2px solid #1A1A1A">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
      <div style="width: 16px; height: 16px; border: 1.5px solid #1A1A1A; box-sizing: border-box"></div>
      <span>Sonimbus</span>
    </div>
    <div style="display: flex; align-items: center; height: 100%">
      <div style="margin-right: 16px; padding: 2px 8px; border: 1.5px dashed #1A1A1A; background: #FFFFFF; font-size: 12px; font-weight: 600">Pantalla 4b · CU-05</div>
      <button aria-label="Minimizar" style="width: 44px; height: 100%; border: none; border-left: 1px solid #8C8C8C; background: transparent; font-size: 14px; color: #1A1A1A">–</button>
      <button aria-label="Maximizar" style="width: 44px; height: 100%; border: none; border-left: 1px solid #8C8C8C; background: transparent; font-size: 13px; color: #1A1A1A">□</button>
      <button aria-label="Cerrar" style="width: 44px; height: 100%; border: none; border-left: 1px solid #8C8C8C; background: transparent; font-size: 14px; color: #1A1A1A">✕</button>
    </div>
  </div>

  <!-- Contenido -->
  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #F0F0F0">
    <main style="width: 460px; box-sizing: border-box; padding: 30px 40px; background: #FFFFFF; border: 1.5px solid #1A1A1A; border-radius: 10px; display: flex; flex-direction: column; gap: 18px">

      <!-- Indicador de pasos -->
      <div aria-label="Paso 2 de 2" style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
        <span style="width: 26px; height: 26px; border-radius: 13px; border: 1.5px solid #1A1A1A; box-sizing: border-box; display: flex; align-items: center; justify-content: center">✓</span>
        <span>Correo</span>
        <span style="flex-grow: 1; height: 2px; background: #1A1A1A"></span>
        <span style="width: 26px; height: 26px; border-radius: 13px; background: #1A1A1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">2</span>
        <span>Nueva contraseña</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 700">Crea una nueva contraseña</h1>
        <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #4D4D4D">Escribe el código que llegó a tu correo y elige tu nueva contraseña.</p>
      </div>

      <form style="display: flex; flex-direction: column; gap: 12px; margin: 0">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <label for="codigo-rec" style="font-size: 14px; font-weight: 600">Código de recuperación</label>
            <button type="button" style="border: none; background: transparent; padding: 0; font-size: 13px; text-decoration: underline; color: #1A1A1A">Reenviar código</button>
          </div>
          <input id="codigo-rec" type="text" inputmode="numeric" maxlength="6" placeholder="000000" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #4D4D4D; border-radius: 6px; font-size: 18px; letter-spacing: 0.4em; color: #1A1A1A; background: #FFFFFF">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="nueva" style="font-size: 14px; font-weight: 600">Nueva contraseña</label>
          <div style="display: flex; gap: 8px">
            <input id="nueva" type="password" aria-describedby="reglas-rec" style="flex-grow: 1; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #4D4D4D; border-radius: 6px; font-size: 14px; color: #1A1A1A; background: #FFFFFF">
            <button type="button" aria-label="Mostrar contraseña" style="height: 44px; padding: 0 12px; border: 1.5px solid #4D4D4D; border-radius: 6px; background: #FFFFFF; font-size: 13px; color: #1A1A1A">Mostrar</button>
          </div>
          <span id="reglas-rec" style="font-size: 12px; color: #4D4D4D">Mínimo 8 caracteres, con al menos una letra y un número.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="confirmar-rec" style="font-size: 14px; font-weight: 600">Confirmar nueva contraseña</label>
          <input id="confirmar-rec" type="password" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1.5px solid #4D4D4D; border-radius: 6px; font-size: 14px; color: #1A1A1A; background: #FFFFFF">
        </div>
        <button type="submit" style="height: 46px; margin-top: 4px; border: none; border-radius: 6px; background: #1A1A1A; color: #FFFFFF; font-size: 15px; font-weight: 600">Restablecer contraseña</button>
      </form>

      <p style="margin: 0; text-align: center; font-size: 14px"><a href="#">Volver a iniciar sesión</a></p>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
