$kind: http-request
url: "{{internal_url}}/internal/v1/sessions/check"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{core_service_token}}
body:
  type: json
  content: |-
    {
      "sid": "{{sid}}",
      "account_id": "{{$guid}}"
    }
scripts:
  - type: beforeRequest
    code: setTimeout(() => {}, 300);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) { pm.execution.setNextRequest(null); throw new Error('Estado inesperado; ejecucion detenida'); }
      pm.test('Respuesta no almacenable', () => { pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'); pm.expect(pm.response.headers.get('X-Content-Type-Options')).to.eql('nosniff'); });
      pm.test('Sesion inactiva', () => { const b=pm.response.json(); pm.expect(b.active).to.eql(false); pm.expect(b.session_expires_at).to.eql(null); });
    language: text/javascript
order: 18000
