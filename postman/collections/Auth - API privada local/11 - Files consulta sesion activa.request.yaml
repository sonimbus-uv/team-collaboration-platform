$kind: http-request
url: "{{internal_url}}/internal/v1/sessions/check"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{files_service_token}}
body:
  type: json
  content: |-
    {
      "sid": "{{sid}}",
      "account_id": "{{account_id}}"
    }
scripts:
  - type: beforeRequest
    code: setTimeout(() => {}, 300);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      if (pm.response.code !== 200) { pm.execution.setNextRequest(null); throw new Error('Estado inesperado; ejecucion detenida'); }
      pm.test('Respuesta no almacenable', () => { pm.expect(pm.response.headers.get('Cache-Control')).to.eql('no-store'); pm.expect(pm.response.headers.get('X-Content-Type-Options')).to.eql('nosniff'); });
      const b=pm.response.json(); pm.test('Sesion activa y vinculada a cuenta', () => { pm.expect(b.active).to.eql(true); pm.expect(b.sid).to.eql(pm.collectionVariables.get('sid')); pm.expect(b.account_id).to.eql(pm.collectionVariables.get('account_id')); pm.expect(Date.parse(b.session_expires_at)).to.be.above(Date.now()); });
    language: text/javascript
order: 11000
