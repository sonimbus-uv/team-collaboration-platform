$kind: http-request
name: http://localhost:18080/api/v1/auth/refresh
description: 04-Registro
url: http://localhost:18080/api/v1/auth/refresh
method: POST
body:
  type: json
  content: "{\r

    \  \"refresh_token\": \"WcuO5b4EMgtU6K2BxGennLnzVrpTzDr2WoLkSjpGKMY\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Refresh devuelve HTTP 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Rota los tokens y conserva la sesión\", () => {\r

      \    const body = pm.response.json();\r

      \    const previous = pm.collectionVariables.get(\"refresh_token\");\r

      \r

      \    pm.expect(body.access_token).to.be.a(\"string\").and.not.empty;\r

      \    pm.expect(body.refresh_token).to.be.a(\"string\").and.not.empty;\r

      \    pm.expect(body.refresh_token).not.to.eql(previous);\r

      \    pm.expect(body.sid).to.eql(pm.collectionVariables.get(\"sid\"));\r

      \    pm.expect(body.account_id)\r

      \        .to.eql(pm.collectionVariables.get(\"account_id\"));\r

      \r

      \    pm.collectionVariables.set(\"previous_refresh_token\", previous);\r

      \    pm.collectionVariables.set(\"refresh_token\", body.refresh_token);\r

      \    pm.collectionVariables.set(\"access_token\", body.access_token);\r

      });\r

      \r

      pm.test(\"El access token dura como máximo 15 minutos\", () => {\r

      \    const body = pm.response.json();\r

      \r

      \    pm.expect(body.access_expires_in).to.be.a(\"number\");\r

      \    pm.expect(body.access_expires_in).to.be.above(0);\r

      \    pm.expect(body.access_expires_in).to.be.at.most(900);\r

      });"
    language: text/javascript
order: 5000
