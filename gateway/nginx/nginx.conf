worker_processes auto;

error_log /dev/null;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    include /etc/nginx/services/*.conf;

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";

        proxy_connect_timeout 1s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        proxy_intercept_errors off;

        limit_req_status 429;
        error_page 429 = @gateway_rate_limited;

        include /etc/nginx/routes/*.conf;

        location @gateway_rate_limited {
            default_type "";

            add_header Content-Type $edge_limit_content_type always;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
            add_header X-RateLimit-Layer "nginx" always;

            return 429 $edge_limit_body;
        }

        location / {
            return 404;
        }
    }
}