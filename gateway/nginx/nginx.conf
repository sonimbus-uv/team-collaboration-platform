worker_processes auto;

error_log /dev/null;

events {
    worker_connections 1024;
}

http {
    map $uri $auth_log_operation {
        default                   other;
        /health                   health;
        /health/db                health_db;
        /auth/register            register;
        /auth/resend-verification resend_verification;
        /auth/verify-email        verify_email;
    }

    log_format auth_safe escape=json
        '{"time":"$time_iso8601",'
        '"operation":"$auth_log_operation",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"limit_req_status":"$limit_req_status"}';

    access_log /dev/stdout auth_safe;
    
    server_tokens off;

    map $request_method $verification_limit_key {
        default $binary_remote_addr;
        HEAD "";
    }

    limit_req_zone $binary_remote_addr
        zone=auth_register:1m
        rate=60r/m;

    limit_req_zone $binary_remote_addr
        zone=auth_resend:1m
        rate=30r/m;

    limit_req_zone $verification_limit_key
        zone=auth_verify:1m
        rate=120r/m;

    map "$request_method:$uri" $edge_limit_content_type {
        default "application/problem+json";
        "GET:/auth/verify-email" "text/html; charset=utf-8";
    }

    map "$request_method:$uri" $edge_limit_body {
        default '{"type":"about:blank","title":"Too many requests","status":429,"detail":"The gateway request budget is exhausted. Please retry later."}';
        "GET:/auth/verify-email" '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Demasiadas solicitudes</title></head><body><h1>Demasiadas solicitudes</h1><p>Inténtalo de nuevo más tarde. Conserva el enlace de tu correo.</p></body></html>';
    }

    upstream auth_service {
        server host.docker.internal:3001;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";

        proxy_connect_timeout 1s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        proxy_intercept_errors off;

        limit_req_status 429;
        error_page 429 = @gateway_rate_limited;

        location = /health {
            proxy_pass http://auth_service;
        }

        location = /health/db {
            proxy_pass http://auth_service;
        }

        location = /auth/register {
            limit_req zone=auth_register burst=12 nodelay;
            proxy_pass http://auth_service;
        }

        location = /auth/resend-verification {
            limit_req zone=auth_resend burst=6 nodelay;
            proxy_pass http://auth_service;
        }

        location = /auth/verify-email {
            limit_req zone=auth_verify burst=30 nodelay;
            proxy_pass http://auth_service;
        }

        location @gateway_rate_limited {
            default_type "";

            add_header Content-Type $edge_limit_content_type always;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
            add_header X-RateLimit-Layer "nginx" always;

            return 429 $edge_limit_body;
        }

        location / {
            return 404;
        }
    }
}