location = /.well-known/jwks.json {
    # Public keys have their own five-minute HTTP cache policy from Auth.
    # Do not charge registration, verification or resend budgets.
    proxy_pass http://auth_service;
}

location = /health {
    proxy_pass http://auth_service;
}

location = /health/db {
    proxy_pass http://auth_service;
}

location = /health/redis {
    proxy_pass http://auth_service;
}

location = /auth/register {
    limit_req zone=auth_register burst=12 nodelay;
    proxy_pass http://auth_service;
}

location = /auth/resend-verification {
    limit_req zone=auth_resend burst=6 nodelay;
    proxy_pass http://auth_service;
}

location = /auth/verify-email {
    limit_req zone=auth_verify burst=30 nodelay;
    proxy_pass http://auth_service;
}
