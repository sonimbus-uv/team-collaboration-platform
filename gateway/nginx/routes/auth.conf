location = /api/v1/auth/login {
    limit_req zone=auth_login burst=12 nodelay;
    proxy_pass http://auth_service;
}

location = /api/v1/auth/refresh {
    limit_req zone=auth_refresh burst=20 nodelay;
    proxy_pass http://auth_service;
}

location = /api/v1/auth/logout {
    limit_req zone=auth_logout burst=20 nodelay;
    proxy_pass http://auth_service;
}

location = /.well-known/jwks.json {
    # Public keys have their own five-minute HTTP cache policy from Auth.
    # Do not charge registration, verification or resend budgets.
    proxy_pass http://auth_service;
}

location = /health {
    proxy_pass http://auth_service;
}

location = /health/db {
    proxy_pass http://auth_service;
}

location = /health/redis {
    proxy_pass http://auth_service;
}

location = /api/v1/auth/register {
    limit_req zone=auth_register burst=12 nodelay;
    proxy_pass http://auth_service;
}

location = /api/v1/auth/resend-verification {
    limit_req zone=auth_resend burst=6 nodelay;
    proxy_pass http://auth_service;
}

location = /api/v1/auth/verify-email {
    limit_req zone=auth_verify burst=30 nodelay;
    proxy_pass http://auth_service;
}

location = /api/v1/auth/change-password {
    client_max_body_size 4k;
    error_page 413 = @auth_password_body_too_large;
    error_page 429 = @gateway_rate_limited;
    limit_req zone=auth_change_password burst=12 nodelay;
    proxy_pass http://auth_service;
}

location = /api/v1/auth/forgot-password {
    client_max_body_size 4k;
    error_page 413 = @auth_password_body_too_large;
    error_page 429 = @gateway_rate_limited;
    limit_req zone=auth_forgot_password burst=12 nodelay;
    proxy_pass http://auth_service;
}

location = /api/v1/auth/reset-password {
    client_max_body_size 4k;
    error_page 413 = @auth_password_body_too_large;
    error_page 429 = @gateway_rate_limited;
    limit_req zone=auth_reset_password burst=20 nodelay;
    proxy_pass http://auth_service;
}
