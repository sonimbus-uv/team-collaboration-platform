  "components": {
    "securitySchemes": {
      "AccessBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Auth-issued Ed25519 access token, never a refresh or service token."
      }
    },
    "schemas": {
      "ChangePassword": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "current_password",
          "new_password"
        ],
        "properties": {
          "current_password": {
            "type": "string",
            "maxLength": 128
          },
          "new_password": {
            "type": "string",
            "minLength": 8,
            "maxLength": 128,
            "description": "Must satisfy the existing registration composition policy; must differ from current password."
          }
        }
      },
      "ForgotPassword": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "email"
        ],
        "properties": {
          "email": {
            "type": "string",
            "maxLength": 254,
            "format": "email",
            "description": "Trim and lowercase; use the existing registration email validator."
          }
        }
      },
      "RecoveryAccepted": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "recovery_attempt_id",
          "expires_at",
          "message"
        ],
        "properties": {
          "recovery_attempt_id": {
            "type": "string",
            "format": "uuid"
          },
          "expires_at": {
