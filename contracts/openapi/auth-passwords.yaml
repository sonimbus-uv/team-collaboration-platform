    "/api/v1/auth/forgot-password": {
      "post": {
        "operationId": "forgotPassword",
        "tags": [
          "Password management"
        ],
        "description": "Creates a real or synthetic recovery attempt. Only one usable real attempt per account: admitting a new real attempt atomically invalidates the previous one under account locking. Suppressed requests (60-second recipient cooldown or mail quota) return generic 202 with a synthetic ID and do not invalidate the current attempt. New real attempts receive their own ten-minute lifetime and five failures. After replacement commits, mail delivery failure never reactivates the old code. Concurrent requests leave only the last committed replacement usable; email arrival order is not authoritative. Same acceptance for unknown, unverified, blocked or passwordless accounts. Only IP limits produce 429. No account creation or Google linking. Repeated replacements can deny recovery availability within quotas.",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ForgotPassword"
              }
