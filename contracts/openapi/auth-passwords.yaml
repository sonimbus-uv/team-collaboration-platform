    "/api/v1/auth/reset-password": {
      "post": {
        "operationId": "resetPassword",
        "tags": [
          "Password management"
        ],
        "description": "Requires attempt ID plus matching recovery code. Five persistent failures maximum, ten-minute lifetime, single use. Code validation precedes password-policy errors. Atomic password update, attempt invalidation and all-session revocation. No automatic login; unknown/ineligible/expired/consumed attempts share invalid-recovery-code. A code replaced by a newer admitted recovery attempt is invalid even before its original expiry and returns the same generic invalid-recovery-code error.",
        "security": [],
        "requestBody": {
          "required": true,
