openapi: 3.1.0
info:
  title: "Sonimbus Core: grupos, canales, invitaciones y perfil"
  version: 0.1.0
  description: >-
    Contrato candidato del recorrido mínimo de Core para la expo: CU-08 (crear
    grupo), CU-10 (crear invitación), CU-11 (unirse), CU-13 (crear y listar
    canales), CU-20 (historial), CU-22 (token de voz, D-15, D-31) y el nombre
    visible de D-29. Pendiente de
    revisión técnica. Errores con Problem Details; `type` es una referencia
    relativa `/problems/<nombre>`. Horas en UTC (RFC 3339).
servers:
  - url: https://api.example.invalid
security:
  - bearerAuth: []
paths:
  /api/v1/groups:
    get:
      operationId: listMyGroups
      summary: Grupos vigentes del usuario, con su rol
      description: >-
        Sin paginación en v0.1: un usuario pertenece a pocos grupos en el MVP.
      responses:
        "200":
          description: Grupos del usuario
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Group" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createGroup
      summary: Crear grupo (CU-08); el creador queda como admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroup" }
      responses:
        "201":
          description: Grupo creado
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/groups/{group_id}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: getGroup
      summary: Grupo del que el usuario es miembro
      responses:
        "200":
          description: Grupo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/groups/{group_id}/members:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listMembers
      summary: Miembros del grupo con su nombre visible
      description: >-
        Solo para miembros del grupo. El nombre sale de la copia local
        `user_profiles` (D-20, D-29). Orden: rol de mayor a menor y después
        fecha de ingreso. Sin paginación en v0.1: los grupos del MVP son
        pequeños.
      responses:
        "200":
          description: Miembros
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/groups/{group_id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    patch:
      operationId: changeMemberRole
      summary: Cambiar el rol de un miembro (CU-14); solo administradores
      description: >-
        Requiere el permiso `manage_roles`, exclusivo del rol `admin`. El nuevo
        rol rige desde la siguiente acción del miembro. Si el cambio dejaría al
        grupo sin administradores (CU-14 EX-01) responde 409
        `/problems/last-admin`; la comprobación bloquea las filas de los
        administradores y es segura ante cambios concurrentes. No se admite en
        grupos archivados. Core avisa al miembro por el tema
        `user:<user_id>` con el evento `member.role.changed`
        ([contrato](../events/member.role.changed.md)).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeMemberRole" }
      responses:
        "200":
          description: Miembro con su nuevo rol
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Member" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            El grupo está archivado (`/problems/group-archived`) o el cambio
            dejaría al grupo sin administradores (`/problems/last-admin`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/groups/{group_id}/members/{user_id}/expel:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: expelMember
      summary: Expulsar a un miembro (CU-15 FA-02)
      description: >-
        Requiere el permiso `moderate` y un rol estrictamente superior al del
        afectado (EX-01); no se puede moderar a uno mismo. Elimina la
        membresía, cierra sus canales de texto y su participación en la voz del
        grupo, y deja una fila en el registro de moderación. El afectado puede
        volver con una invitación nueva. Core le avisa por `user:<user_id>`
        con `moderation.applied`
        ([contrato](../events/moderation.applied.md)). Se admite también en
        grupos archivados.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationRequest" }
      responses:
        "204": { description: Miembro expulsado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/groups/{group_id}/members/{user_id}/ban:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: banMember
      summary: Bloquear a un miembro (CU-15 FA-03)
      description: >-
        Igual que la expulsión, y además impide el reingreso: unirse con una
        invitación responde 403 `/problems/banned` hasta que se retire el
        bloqueo.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationRequest" }
      responses:
        "204": { description: Miembro bloqueado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/groups/{group_id}/bans:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listBans
      summary: Usuarios bloqueados del grupo (CU-15 FA-04, paso 1)
      description: >-
        Requiere el permiso `moderate`. Del más reciente al más antiguo. El
        nombre sale de la copia local `user_profiles`; es nulo si no existe o
        la cuenta está eliminada.
      responses:
        "200":
          description: Bloqueos vigentes
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Ban" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/groups/{group_id}/bans/{user_id}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    delete:
      operationId: unbanUser
      summary: Retirar un bloqueo (CU-15 FA-04)
      description: >-
        Requiere el permiso `moderate`. El usuario puede volver con una
        invitación; no recupera su membresía. Queda registrado en el registro
        de moderación.
      responses:
        "204": { description: Bloqueo retirado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/groups/{group_id}/roles:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listRoles
      summary: Permisos de cada rol del grupo (CU-14)
      description: >-
        Solo para miembros del grupo. Devuelve los tres roles, de menor a
        mayor, con todos los permisos del catálogo cerrado (D-18) y si cada uno
        está activo. `manage_group` y `manage_roles` son exclusivos de `admin`
        y siempre están activos para él.
      responses:
        "200":
          description: Roles con sus permisos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/RolePermissions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/groups/{group_id}/roles/{role}/permissions:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/RoleName"
    put:
      operationId: updateRolePermissions
      summary: Activar o desactivar permisos de un rol (CU-14 FA-01); solo administradores
      description: >-
        Requiere `manage_roles`. Solo se envían los permisos que cambian; los
        demás se conservan. Se aplican a todos los miembros que tengan ese rol,
        desde su siguiente acción. Los permisos `manage_group` y
        `manage_roles` no son ajustables: intentar cambiarlos, o un permiso
        fuera del catálogo, responde 422. No se admite en grupos archivados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRolePermissions" }
      responses:
        "200":
          description: Permisos vigentes del rol
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/RolePermissions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/GroupArchived" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/groups/{group_id}/invitations:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      operationId: createInvitation
      summary: Crear invitación (CU-10); rol moderator o superior
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInvitation" }
      responses:
        "201":
          description: Invitación creada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/GroupArchived" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/invitations/join:
    post:
      operationId: joinGroup
      summary: Unirse a un grupo con una invitación (CU-11)
      description: >-
        La membresía y el descuento del uso ocurren en una sola transacción.
        El código va en el cuerpo para que no quede en los registros de acceso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201":
          description: El usuario se unió como member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupEnvelope" }
        "200":
          description: Ya era miembro; no se descontó ningún uso (CU-11 EX-02)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Usuario bloqueado en el grupo (CU-11 EX-03), `/problems/banned`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: >-
            Invitación inexistente, caducada, revocada o agotada (CU-11 EX-01),
            `/problems/invitation-invalid`. No distingue el motivo.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/groups/{group_id}/channels:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    get:
      operationId: listChannels
      summary: Canales que el rol del usuario puede ver (D-17)
      responses:
        "200":
          description: Canales por nombre
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createChannel
      summary: Crear canal (CU-13); rol admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChannel" }
      responses:
        "201":
          description: Canal creado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Nombre repetido en el grupo (`/problems/conflict`, CU-13 EX-01) o
            grupo archivado (`/problems/group-archived`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/channels/{channel_id}/messages:
    parameters:
      - name: channel_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listMessages
      summary: Historial de un canal de texto, del más reciente al más antiguo (CU-20)
      description: >-
        Paginación por cursor. El envío va por WebSocket
        (contracts/events/message.created.md).


        Con `around` la página se centra en ese mensaje (CU-20 FA-01, "ir al
        mensaje original"): lo incluye, hasta `limit / 2` mensajes posteriores
        y el resto anteriores, siempre del más reciente al más antiguo.
        `next_cursor` sigue siendo el cursor hacia atrás. Cargar páginas más
        nuevas que la entregada no está en esta versión. `around` y `before` no
        se combinan.
      parameters:
        - name: before
          in: query
          required: false
          description: Cursor; `next_cursor` de la página anterior
          schema: { type: string, format: uuid }
        - name: around
          in: query
          required: false
          description: >-
            `id` de un mensaje del canal; el mensaje no existe en el canal:
            404. Con `before` responde 422.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Página del historial
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Message" }
                  next_cursor:
                    type: [string, "null"]
                    format: uuid
                    description: Nulo cuando no quedan mensajes
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: El canal es de voz, `/problems/not-a-text-channel`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503":
          description: ScyllaDB no responde, `/problems/messages-unavailable`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/channels/{channel_id}/messages/{message_id}:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - $ref: "#/components/parameters/MessageId"
    patch:
      operationId: editMessage
      summary: Editar un mensaje propio (CU-19)
      description: >-
        Solo el autor. Guarda el nuevo contenido y marca `edited_at`. El
        contenido tiene 1–4000 caracteres (D-22); puede ir vacío solo si el
        mensaje tiene archivo. No se admite en grupos archivados. Core difunde
        `message.updated` al tema `channel:<channel_id>`
        ([contrato](../events/message.updated.md)). Equivale al evento
        `message.update` del WebSocket.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditMessage" }
      responses:
        "200":
          description: Mensaje editado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: El grupo está archivado (`/problems/group-archived`) o el canal es de voz (`/problems/not-a-text-channel`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503":
          description: ScyllaDB no responde, `/problems/messages-unavailable`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      operationId: deleteMessage
      summary: Eliminar un mensaje, propio (CU-19 FA-01) o ajeno por moderación (CU-15 FA-01)
      description: >-
        El mensaje no se borra: queda con `deleted = true` y sin `content` ni
        `file_id`, de modo que el historial muestra el aviso y sus adjuntos
        dejan de estar disponibles. Equivale al evento `message.delete` del
        WebSocket. Core difunde `message.deleted`
        ([contrato](../events/message.deleted.md)).


        - **El autor** lo elimina con `deleted_reason = author` ("Mensaje
        eliminado"). No se admite en grupos archivados.

        - **Moderación:** quien tenga el permiso `moderate` y un rol
        estrictamente superior al del autor (o el autor ya no sea miembro) lo
        elimina con `deleted_reason = moderation` ("Mensaje eliminado por
        moderación"), aunque el grupo esté archivado. Queda en el registro de
        moderación y Core avisa al autor por `user:<user_id>` con
        `moderation.applied` ([contrato](../events/moderation.applied.md)).
        `reason` es opcional y solo se usa en este caso.

        Un rol igual o superior, o sin permiso, responde 403.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModerationRequest" }
      responses:
        "204": { description: Mensaje eliminado }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: El grupo está archivado (`/problems/group-archived`) o el canal es de voz (`/problems/not-a-text-channel`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: ScyllaDB no responde, `/problems/messages-unavailable`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/channels/{channel_id}/messages/{message_id}/reactions:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
      - $ref: "#/components/parameters/MessageId"
    post:
      operationId: toggleReaction
      summary: Reaccionar a un mensaje o retirar la reacción (CU-18)
      description: >-
        Alterna la reacción del usuario con ese emoji: si no la tenía, la
        agrega; si ya la tenía, la retira (FA-01). Cada usuario tiene como
        máximo una reacción de cada emoji por mensaje, incluso con peticiones
        simultáneas. `emoji` es un único emoji (un grafema de hasta 32 bytes,
        no una letra ni un número). No se admite en grupos archivados ni sobre
        mensajes eliminados (EX-01). Core difunde `reaction.updated` al tema
        `channel:<channel_id>` ([contrato](../events/reaction.updated.md)).
        Equivale al evento `reaction.toggle` del WebSocket.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToggleReaction" }
      responses:
        "200":
          description: Estado de la reacción del usuario y total del emoji
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ReactionState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            El grupo está archivado (`/problems/group-archived`), el mensaje se
            eliminó (`/problems/message-deleted`) o el canal es de voz
            (`/problems/not-a-text-channel`)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503":
          description: ScyllaDB no responde, `/problems/messages-unavailable`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/channels/{channel_id}/voice-token:
    parameters:
      - $ref: "#/components/parameters/ChannelId"
    post:
      operationId: createVoiceToken
      summary: Token de LiveKit para entrar a un canal de voz (CU-22, D-15, D-31)
      description: >-
        Core verifica que el usuario sea miembro del grupo con un rol igual o
        superior a `min_role` del canal (D-17); si no, responde 404 sin
        distinguir el motivo, como el resto de las rutas de canal. Después firma un JWT de LiveKit con la
        clave y el secreto de la API de LiveKit, que nunca salen de Core. Sin
        cuerpo.


        Cada llamada emite un token nuevo; el cliente pide uno por cada
        conexión o reconexión a la sala.


        Contenido del token:

        - `video.room`: el `id` del canal. Una sala por canal.

        - `video.roomJoin`: `true`.

        - `video.canSubscribe`: `true`.

        - `video.canPublish`: `true`.

        - `video.canPublishSources`: `["microphone", "camera"]`, explícito. La
        pantalla compartida queda fuera (D-31, T-15): `screen_share` y
        `screen_share_audio` no se otorgan.

        - `video.canPublishData`: `false`.

        - `sub` e `identity`: el `user_id` del usuario (`auth.accounts.id`).

        - `name`: el nombre visible vigente, si existe.

        - `exp`: corta, ver `expires_at`. Solo rige la entrada a la sala; no
        sustituye la desconexión por expulsión o bloqueo (CU-15).


        Un canal de texto no admite token. Un grupo archivado es de solo
        lectura y tampoco lo admite.
      responses:
        "200":
          description: Token emitido
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/VoiceToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/GroupArchived" }
        "422":
          description: El canal es de texto, `/problems/not-a-voice-channel`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: >-
            El servidor de medios no está disponible (CU-22 EX-01),
            `/problems/voice-unavailable`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /api/v1/me/profile:
    get:
      operationId: getMyProfile
      summary: Copia local del perfil del usuario
      responses:
        "200":
          description: Perfil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putMyProfile
      summary: Guardar el nombre visible (D-29, desviación temporal de D-20)
      description: >-
        Solo mientras Auth no publique el perfil. Cuando llegue el primer
        `user.updated` (versión mayor que 0), el nombre lo administra Auth y
        esta operación responde 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name]
              properties:
                display_name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: Perfil guardado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: El perfil ya lo administra Auth, `/problems/profile-managed-by-auth`
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422": { $ref: "#/components/responses/ValidationError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Access JWT de Auth (contracts/token-profile.md) con `sonimbus-core` en
        `aud`. Si Core no puede obtener un JWKS vigente responde 503
        `/problems/auth-unavailable` con `Retry-After`.
  parameters:
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MessageId:
      name: message_id
      in: path
      required: true
      description: timeuuid del mensaje
      schema: { type: string, format: uuid }
    GroupId:
      name: group_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleName:
      name: role
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Role" }
  schemas:
    VoiceToken:
      type: object
      required: [token, url, expires_at]
      properties:
        token:
          type: string
          description: JWT de LiveKit firmado por Core; no se registra en logs
        url:
          type: string
          format: uri
          description: URL WebSocket del servidor LiveKit (`wss://` en producción)
        expires_at:
          type: string
          format: date-time
          description: >-
            Instante en que el token deja de servir para entrar a la sala
            (propuesta: 300 s después de emitirlo)
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        errors:
          description: Solo en 409 y 422; mensajes por campo
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    Role:
      type: string
      enum: [member, moderator, admin]
      description: Ordenados de menor a mayor (D-18)
    CreateGroup:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        image_id: { type: string, format: uuid, description: Archivo del File Service }
    Group:
      type: object
      required: [id, name, created_by, role, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        image_id: { type: [string, "null"], format: uuid }
        created_by: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        archived_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    GroupEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Group" }
    Member:
      type: object
      required: [user_id, role, joined_at, display_name]
      properties:
        user_id: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }
        display_name:
          type: [string, "null"]
          description: >-
            Nulo si el usuario nunca guardó su nombre o si su cuenta está
            eliminada (se muestra anonimizado)
    Permission:
      type: string
      enum: [invite_members, moderate, manage_channels, manage_projects, manage_group, manage_roles]
      description: >-
        Catálogo cerrado (D-18). `manage_group` y `manage_roles` son exclusivos
        de `admin`.
    ChangeMemberRole:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    RolePermissions:
      type: object
      required: [role, permissions]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        permissions:
          type: object
          description: Un booleano por cada permiso del catálogo
          propertyNames: { $ref: "#/components/schemas/Permission" }
          additionalProperties: { type: boolean }
    UpdateRolePermissions:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: object
          minProperties: 1
          propertyNames: { $ref: "#/components/schemas/Permission" }
          additionalProperties: { type: boolean }
    ModerationRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: Motivo opcional }
    Ban:
      type: object
      required: [user_id, banned_by, created_at, display_name]
      properties:
        user_id: { type: string, format: uuid }
        banned_by: { type: string, format: uuid }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        display_name: { type: [string, "null"] }
    CreateInvitation:
      type: object
      properties:
        expires_in:
          type: integer
          minimum: 3600
          maximum: 2592000
          default: 604800
          description: Segundos hasta la caducidad (1 h a 30 días, D-22)
        max_uses:
          type: [integer, "null"]
          minimum: 1
          maximum: 100
          description: Nulo u omitido = ilimitado
    Invitation:
      type: object
      required: [id, group_id, code, expires_at, uses, created_at]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        code: { type: string }
        expires_at: { type: string, format: date-time }
        max_uses: { type: [integer, "null"] }
        uses: { type: integer }
        created_at: { type: string, format: date-time }
    CreateChannel:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, pattern: "^[a-z0-9-]+$" }
        description: { type: string, maxLength: 500 }
        type: { type: string, enum: [text, voice] }
        min_role: { $ref: "#/components/schemas/Role" }
    Channel:
      type: object
      required: [id, group_id, name, type, min_role, created_at]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        type: { type: string, enum: [text, voice] }
        min_role: { $ref: "#/components/schemas/Role" }
        created_at: { type: string, format: date-time }
    Message:
      type: object
      required: [id, channel_id, author_id, author, client_message_id, created_at, deleted]
      properties:
        id: { type: string, format: uuid, description: timeuuid asignado por Core (D-08) }
        channel_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        author:
          type: object
          description: >-
            Nombre visible del autor al momento de la respuesta. Si cambia
            después, los mensajes ya cargados conservan el anterior; la lista
            de miembros tiene el vigente.
          required: [id, display_name]
          properties:
            id: { type: string, format: uuid }
            display_name:
              type: [string, "null"]
              description: Nulo sin perfil o con cuenta eliminada
        client_message_id: { type: string, format: uuid }
        content: { type: [string, "null"], description: Nulo si está eliminado }
        reply_to: { type: [string, "null"], format: uuid }
        reply_preview:
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/ReplyPreview" }
          description: Nulo si el mensaje no responde a otro (CU-17)
        file_id: { type: [string, "null"], format: uuid }
        reactions:
          type: array
          description: >-
            Reacciones por emoji, en orden alfabético; vacío en un mensaje
            eliminado o sin reacciones
          items: { $ref: "#/components/schemas/ReactionSummary" }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, "null"], format: date-time }
        deleted: { type: boolean }
        deleted_reason:
          type: [string, "null"]
          enum: [author, moderation, null]
          description: >-
            Quién eliminó el mensaje: `author` ("Mensaje eliminado") o
            `moderation` ("Mensaje eliminado por moderación"). Nulo si no está
            eliminado.
    ReplyPreview:
      type: object
      required: [id, unavailable]
      description: >-
        Vista previa del mensaje al que responde (CU-17). Si el original se
        eliminó o ya no existe, `unavailable` es `true` y el cliente muestra
        "Mensaje original no disponible" (EX-01).
      properties:
        id: { type: string, format: uuid }
        unavailable: { type: boolean }
        author:
          type: object
          required: [id, display_name]
          description: Solo cuando `unavailable` es `false`
          properties:
            id: { type: string, format: uuid }
            display_name: { type: [string, "null"] }
        content:
          type: string
          maxLength: 100
          description: Primeros 100 caracteres del original; solo cuando `unavailable` es `false`
    ReactionSummary:
      type: object
      required: [emoji, count, reacted_by_me]
      properties:
        emoji: { type: string }
        count: { type: integer, minimum: 1 }
        reacted_by_me:
          type: boolean
          description: Si quien consulta ha reaccionado con ese emoji
    ToggleReaction:
      type: object
      required: [emoji]
      properties:
        emoji: { type: string, maxLength: 32 }
    ReactionState:
      type: object
      required: [emoji, count, active]
      properties:
        emoji: { type: string }
        count: { type: integer, minimum: 0, description: Reacciones activas con ese emoji }
        active: { type: boolean, description: Si el usuario tiene ahora la reacción }
    EditMessage:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 4000 }
    ProfileEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user_id, display_name, updated_at]
          properties:
            user_id: { type: string, format: uuid }
            display_name: { type: string }
            avatar_id: { type: [string, "null"] }
            updated_at: { type: string, format: date-time }
  responses:
    Unauthorized:
      description: Falta el access JWT o no es válido, `/problems/unauthorized`
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: El rol no permite la acción, `/problems/forbidden`
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: >-
        No existe o el usuario no tiene acceso; no se distingue, `/problems/not-found`
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    GroupArchived:
      description: El grupo está archivado (solo lectura), `/problems/group-archived`
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: Campos inválidos, `/problems/validation-error`
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
