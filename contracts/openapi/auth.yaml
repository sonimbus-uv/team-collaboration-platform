{
  "openapi": "3.1.0",
  "info": {
    "title": "Sonimbus Auth: API pública",
    "version": "0.5.0",
    "description": "Contrato público compuesto de registro, sesiones, contraseñas y JWKS. Las operaciones funcionales se definen una sola vez en auth-registration.yaml, auth-sessions.yaml y auth-passwords.yaml. Semántica: ../auth/public-api.md y ../auth/tokens.md. Login y contraseñas requieren activación explícita; la integración de consumidores y el despliegue permanecen sujetos a revisión. Login Google se define en auth-google.yaml y requiere activación independiente. La verificación de contacto se define en auth-contact-email.yaml y tiene activación propia."
  },
  "servers": [
    {
      "url": "https://api.example.invalid"
    }
  ],
  "paths": {
    "/api/v1/auth/login": {
      "$ref": "./auth-sessions.yaml#/paths/~1api~1v1~1auth~1login"
    },
    "/api/v1/auth/refresh": {
      "$ref": "./auth-sessions.yaml#/paths/~1api~1v1~1auth~1refresh"
    },
    "/api/v1/auth/logout": {
      "$ref": "./auth-sessions.yaml#/paths/~1api~1v1~1auth~1logout"
    },
    "/.well-known/jwks.json": {
      "get": {
        "operationId": "jwks",
        "security": [],
        "responses": {
          "200": {
            "description": "Claves públicas Ed25519",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "public, max-age=300, must-revalidate"
                },
                "description": "public, max-age=300, must-revalidate"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JWKS"
                }
              }
            }
          },
          "503": {
            "description": "Indisponibilidad temporal, no revocación",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/auth-unavailable"
                        },
                        "status": {
                          "const": 503
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            }
          }
        },
        "description": "Snapshot público inmutable validado al arrancar. No consume presupuestos de registro, verificación, reenvío o destinatario. Sin ETag/Last-Modified/304 acordados; devuelve representación completa."
      },
      "head": {
        "operationId": "jwksHead",
        "security": [],
        "description": "Mismos encabezados de GET, sin cuerpo.",
        "responses": {
          "200": {
            "description": "Metadatos de JWKS sin cuerpo",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "public, max-age=300, must-revalidate"
                },
                "description": "public, max-age=300, must-revalidate"
              }
            }
          }
        }
      }
    },
    "/api/v1/auth/register": {
      "$ref": "./auth-registration.yaml#/paths/~1api~1v1~1auth~1register"
    },
    "/api/v1/auth/verify-email": {
      "$ref": "./auth-registration.yaml#/paths/~1api~1v1~1auth~1verify-email"
    },
    "/api/v1/auth/resend-verification": {
      "$ref": "./auth-registration.yaml#/paths/~1api~1v1~1auth~1resend-verification"
    },
    "/api/v1/auth/change-password": {
      "$ref": "./auth-passwords.yaml#/paths/~1api~1v1~1auth~1change-password"
    },
    "/api/v1/auth/forgot-password": {
      "$ref": "./auth-passwords.yaml#/paths/~1api~1v1~1auth~1forgot-password"
    },
    "/api/v1/auth/reset-password": {
      "$ref": "./auth-passwords.yaml#/paths/~1api~1v1~1auth~1reset-password"
    },
    "/api/v1/auth/google/attempts": {
      "$ref": "./auth-google.yaml#/paths/~1api~1v1~1auth~1google~1attempts"
    },
    "/api/v1/auth/google/authorize": {
      "$ref": "./auth-google.yaml#/paths/~1api~1v1~1auth~1google~1authorize"
    },
    "/api/v1/auth/google/callback": {
      "$ref": "./auth-google.yaml#/paths/~1api~1v1~1auth~1google~1callback"
    },
    "/api/v1/auth/google/exchange": {
      "$ref": "./auth-google.yaml#/paths/~1api~1v1~1auth~1google~1exchange"
    },
    "/api/v1/auth/google/link-attempts": {
      "$ref": "./auth-google.yaml#/paths/~1api~1v1~1auth~1google~1link-attempts"
    },
    "/api/v1/auth/reauthenticate": {
      "$ref": "./auth-google.yaml#/paths/~1api~1v1~1auth~1reauthenticate"
    },
    "/api/v1/auth/connections": {
      "$ref": "./auth-google.yaml#/paths/~1api~1v1~1auth~1connections"
    },
    "/api/v1/auth/contact-email": {
      "$ref": "./auth-contact-email.yaml#/paths/~1api~1v1~1auth~1contact-email"
    },
    "/api/v1/auth/contact-email/verification-attempts": {
      "$ref": "./auth-contact-email.yaml#/paths/~1api~1v1~1auth~1contact-email~1verification-attempts"
    },
    "/api/v1/auth/contact-email/verification-resends": {
      "$ref": "./auth-contact-email.yaml#/paths/~1api~1v1~1auth~1contact-email~1verification-resends"
    },
    "/api/v1/auth/contact-email/verify": {
      "$ref": "./auth-contact-email.yaml#/paths/~1api~1v1~1auth~1contact-email~1verify"
    }
  },
  "components": {
    "schemas": {
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "status"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri-reference"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "detail": {
            "type": "string"
          }
        }
      },
      "Refresh": {
        "$ref": "./auth-sessions.yaml#/components/schemas/Refresh"
      },
      "Tokens": {
        "$ref": "./auth-sessions.yaml#/components/schemas/Tokens"
      },
      "Login": {
        "$ref": "./auth-sessions.yaml#/components/schemas/Login"
      },
      "JWKS": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "keys"
        ],
        "properties": {
          "keys": {
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "#/components/schemas/PublicKey"
            }
          }
        }
      },
      "PublicKey": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "kty",
          "crv",
          "use",
          "alg",
          "kid",
          "x"
        ],
        "properties": {
          "kty": {
            "const": "OKP"
          },
          "crv": {
            "const": "Ed25519"
          },
          "use": {
            "const": "sig"
          },
          "alg": {
            "const": "EdDSA"
          },
          "kid": {
            "type": "string",
            "minLength": 1
          },
          "x": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{43}$"
          }
        }
      },
      "Registration": {
        "$ref": "./auth-registration.yaml#/components/schemas/Registration"
      },
      "RegistrationAttempt": {
        "$ref": "./auth-registration.yaml#/components/schemas/RegistrationAttempt"
      },
      "RegistrationConfirmation": {
        "$ref": "./auth-registration.yaml#/components/schemas/RegistrationConfirmation"
      },
      "RegistrationResend": {
        "$ref": "./auth-registration.yaml#/components/schemas/RegistrationResend"
      },
      "VerifiedAccount": {
        "$ref": "./auth-registration.yaml#/components/schemas/VerifiedAccount"
      }
    },
    "securitySchemes": {
      "AccessBearer": {
        "$ref": "./auth-passwords.yaml#/components/securitySchemes/AccessBearer"
      }
    }
  }
}
