                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/auth-unavailable"
                        },
                        "status": {
                          "const": 503
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            }
          }
        },
        "description": "Login de contraseña. AUTH_LOGIN_ENABLED=false por defecto mientras #17 siga abierto: 503 auth-unavailable. Cuenta no habilitada y credenciales incorrectas: 401 genérico. Ver ../auth-session-flows.md y ../../services/auth/SESSIONS.md."
      }
    },
