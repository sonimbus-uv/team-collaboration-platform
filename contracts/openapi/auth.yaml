{
  "openapi": "3.1.0",
  "info": {
    "title": "Sonimbus Auth: sesiones y JWKS",
    "version": "0.1.0",
    "description": "Diseño Refs #35; no implementado. Alcance parcial: registro/verificación existentes /auth/... permanecen fuera de este archivo y pendientes en #14. Rutas de sesión propuestas; ver ../auth-session-flows.md y ../token-profile.md. Todos los parámetros operativos adicionales son propuestas pendientes de revisión."
  },
  "servers": [
    {
      "url": "https://api.example.invalid"
    }
  ],
  "paths": {
    "/api/v1/auth/login": {
      "post": {
        "operationId": "login",
        "security": [],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Login"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Par de tokens; sesión absoluta 20 días",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Tokens"
                }
              }
            }
          },
          "400": {
            "description": "Entrada inválida",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/malformed-request"
                        },
                        "status": {
                          "const": 400
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            }
          },
          "401": {
            "description": "Credencial inválida",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/invalid-credentials"
                        },
                        "status": {
                          "const": 401
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              },
              "WWW-Authenticate": {
                "schema": {
                  "type": "string"
                },
                "description": "Bearer challenge sin datos sensibles"
              }
            }
          },
          "429": {
            "description": "Límite excedido; Retry-After en segundos",
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              },
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/too-many-requests"
                        },
                        "status": {
                          "const": 429
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "500": {
            "description": "Error interno",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/internal-error"
                        },
                        "status": {
                          "const": 500
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            }
          },
          "503": {
            "description": "Indisponibilidad temporal, no revocación",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/auth-unavailable"
                        },
                        "status": {
                          "const": 503
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            }
          }
        },
        "description": "Semántica normativa: ../auth-session-flows.md"
      }
    },
