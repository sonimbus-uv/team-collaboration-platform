          },
          "400": {
            "description": "Entrada inválida",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/malformed-request"
                        },
                        "status": {
                          "const": 400
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            }
          },
          "401": {
            "description": "Credencial inválida",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/invalid-credentials"
                        },
                        "status": {
                          "const": 401
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              },
              "WWW-Authenticate": {
                "schema": {
                  "type": "string"
                },
                "description": "Bearer challenge sin datos sensibles"
              }
            }
          },
          "429": {
            "description": "Límite excedido; Retry-After en segundos",
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              },
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/too-many-requests"
                        },
                        "status": {
                          "const": 429
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "500": {
            "description": "Error interno",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/internal-error"
                        },
                        "status": {
                          "const": 500
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            }
          },
          "503": {
            "description": "Indisponibilidad temporal, no revocación",
