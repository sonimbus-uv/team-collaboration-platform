  "components": {
    "schemas": {
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "status"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri-reference"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "detail": {
            "type": "string"
          }
        }
      },
      "Refresh": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "refresh_token"
        ],
        "properties": {
          "refresh_token": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512
          }
        }
      },
      "Tokens": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "access_token",
          "refresh_token",
          "token_type",
          "access_expires_in",
          "session_expires_at",
          "sid",
          "account_id"
        ],
        "properties": {
          "access_token": {
            "type": "string"
          },
          "refresh_token": {
            "type": "string"
          },
          "token_type": {
            "type": "string",
            "enum": [
              "Bearer"
            ]
          },
          "access_expires_in": {
            "type": "integer",
            "minimum": 1,
            "maximum": 900
          },
          "session_expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "sid": {
            "type": "string",
            "format": "uuid"
          },
          "account_id": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "Login": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "email",
          "password",
          "client_type"
        ],
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string",
            "writeOnly": true
          },
          "client_type": {
            "type": "string",
            "enum": [
              "desktop",
              "mobile"
            ]
          },
          "device_name": {
            "type": "string",
            "maxLength": 120
          }
        }
      },
      "JWKS": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "keys"
        ],
        "properties": {
          "keys": {
            "type": "array",
            "minItems": 1,
            "items": {
              "$ref": "#/components/schemas/PublicKey"
            }
          }
        }
      },
      "PublicKey": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "kty",
          "crv",
          "use",
          "alg",
          "kid",
          "x"
        ],
        "properties": {
          "kty": {
            "const": "OKP"
          },
          "crv": {
            "const": "Ed25519"
          },
          "use": {
            "const": "sig"
          },
          "alg": {
            "const": "EdDSA"
          },
          "kid": {
            "type": "string",
            "minLength": 1
          },
          "x": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{43}$"
          }
        }
      }
    }
  }
}
