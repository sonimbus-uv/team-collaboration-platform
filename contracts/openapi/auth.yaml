    "/.well-known/jwks.json": {
      "get": {
        "operationId": "jwks",
        "security": [],
        "responses": {
          "200": {
            "description": "Claves públicas Ed25519",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "public, max-age=300, must-revalidate"
                },
                "description": "public, max-age=300, must-revalidate"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/JWKS"
                }
              }
            }
          },
          "503": {
            "description": "Indisponibilidad temporal, no revocación",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
