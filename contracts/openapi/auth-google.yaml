    "/api/v1/auth/google/exchange": {
      "post": {
        "operationId": "exchangeGoogleLogin",
        "security": [
          {
            "AttemptSecret": []
          }
        ],
        "description": "Comprueba secreto, código de un uso y PKCE S256. Crea o recupera identidad por subject; confirma identidad, sesión, refresh y consumo en una sola transacción. No vincula por coincidencia de correo. Ante resultado incierto debe iniciarse un flujo nuevo. El propósito de la base determina el resultado: login devuelve 200 Tokens; vinculación devuelve 204 sin tokens. Revalida sesión y evidencia inicial. Conflictos: identity-already-linked, provider-already-linked o account-link-conflict. Vincular la misma identidad es idempotente sin otro evento ni aviso. El aviso solo se encola para contacto verificado; el worker requiere AUTH_SECURITY_NOTIFICATIONS_ENABLED y utiliza reintentos acotados con semántica de al menos una vez.",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Exchange"
              }
            }
