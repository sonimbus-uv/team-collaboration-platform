  "components": {
    "schemas": {
      "CreateAttempt": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "client_type",
          "redirect_target",
          "code_challenge"
        ],
        "properties": {
          "client_type": {
            "type": "string",
            "enum": [
              "desktop",
              "mobile"
            ]
          },
          "redirect_target": {
            "type": "string",
            "maxLength": 64,
            "description": "Identificador registrado y asociado al tipo de cliente; no es una URL."
          },
          "code_challenge": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{43}$"
          },
          "device_name": {
            "type": "string",
            "maxLength": 120
          }
        }
      },
      "Attempt": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "attempt_id",
          "attempt_secret",
          "authorization_url",
          "expires_at"
        ],
        "properties": {
          "attempt_id": {
            "type": "string",
            "format": "uuid"
          },
          "attempt_secret": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{43}$"
          },
          "authorization_url": {
            "type": "string",
            "format": "uri"
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          }
        }
      },
      "Exchange": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "attempt_id",
          "completion_code",
          "code_verifier"
        ],
        "properties": {
          "attempt_id": {
            "type": "string",
            "format": "uuid"
          },
          "completion_code": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{43}$"
          },
          "code_verifier": {
            "type": "string",
            "minLength": 43,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9._~-]+$"
          }
        }
      },
      "LinkAttempt": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "redirect_target",
          "code_challenge"
        ],
        "properties": {
          "redirect_target": {
            "type": "string",
            "maxLength": 64,
            "description": "Identificador registrado y asociado al tipo de cliente; no es una URL."
          },
          "code_challenge": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_-]{43}$"
          }
        }
      },
      "Reauthenticate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "password"
        ],
        "properties": {
          "password": {
            "type": "string",
            "maxLength": 128,
            "writeOnly": true
          }
        }
      },
      "Connections": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "connections"
        ],
        "properties": {
          "connections": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "provider",
                "provider_email",
                "linked_at"
              ],
              "properties": {
                "provider": {
                  "type": "string",
                  "const": "google"
                },
                "provider_email": {
                  "type": [
                    "string",
                    "null"
                  ]
                },
                "linked_at": {
                  "type": "string",
                  "format": "date-time"
                }
              }
            }
          }
        }
      }
    },
    "securitySchemes": {
      "AttemptSecret": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Auth-Attempt-Secret",
        "description": "Secreto de intento de 256 bits; no se envía al navegador ni a Google."
      },
      "AccessBearer": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT",
        "description": "Access Sonimbus validado y sesión autoritativa activa. El cuerpo no selecciona cuenta ni sesión."
      }
    }
  }
}
