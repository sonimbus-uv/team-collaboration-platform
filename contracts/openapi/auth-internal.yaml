  },
  "components": {
    "securitySchemes": {
      "ServiceBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "Token svc_ seguido de base64url sin padding de 32 bytes aleatorios; solo backend y HTTPS verificado. Auth almacena SHA-256 del token ASCII completo y permite una credencial anterior con fecha absoluta; distribución y reinicio coordinados según INTERNAL_API.md. Un JWT de usuario es rechazado."
      }
    },
    "schemas": {
      "Problem": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "type",
          "title",
          "status"
        ],
        "properties": {
          "type": {
            "type": "string",
            "format": "uri-reference"
          },
          "title": {
            "type": "string"
          },
          "status": {
            "type": "integer",
            "minimum": 400,
            "maximum": 599
          },
          "detail": {
            "type": "string"
          }
        }
      },
      "SessionPair": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sid",
          "account_id"
        ],
        "properties": {
          "sid": {
            "type": "string",
            "format": "uuid"
          },
          "account_id": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "SessionResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sid",
          "account_id",
          "active",
          "session_expires_at"
        ],
        "properties": {
          "sid": {
            "type": "string",
            "format": "uuid"
          },
          "account_id": {
            "type": "string",
            "format": "uuid"
          },
          "active": {
            "type": "boolean"
          },
          "session_expires_at": {
            "type": [
              "string",
              "null"
            ],
            "format": "date-time",
            "description": "No nulo para active=true; null para false. Vencimiento absoluto, no TTL deslizante."
          }
        },
        "allOf": [
          {
            "if": {
              "properties": {
                "active": {
                  "const": true
                }
              }
            },
            "then": {
              "properties": {
                "session_expires_at": {
                  "type": "string",
                  "format": "date-time"
                }
              }
            },
            "else": {
              "properties": {
                "session_expires_at": {
                  "type": "null"
                }
              }
            }
          }
        ]
      },
      "Batch": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "sessions"
        ],
        "properties": {
          "sessions": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "uniqueItems": true,
            "items": {
              "$ref": "#/components/schemas/SessionPair"
            }
          }
        }
      },
      "BatchResult": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "results"
        ],
        "properties": {
          "results": {
            "type": "array",
            "minItems": 1,
            "maxItems": 100,
            "items": {
              "$ref": "#/components/schemas/SessionResult"
            }
          }
        }
      }
    }
  }
}
