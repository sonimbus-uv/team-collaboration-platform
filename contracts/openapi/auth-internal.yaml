{
  "openapi": "3.1.0",
  "info": {
    "title": "Sonimbus Auth: comprobación privada de sesiones",
    "version": "0.1.0",
    "description": "Refs #35. Contrato HTTP 4B aprobado por el solicitante el 2026-10-27 e implementado con activación explícita; no acredita despliegue ni interoperabilidad. HTTPS privado directo, sin gateway público. Bearer svc_ opaco independiente por Core/Files con sessions:check. Cuerpo 64 KiB, lotes 1-100 pares distintos; cuota ponderada y concurrencia por identidad compartidas mediante Redis. Modelo, límites aprobados y operación en ../../services/auth/INTERNAL_API.md; semántica temporal y consumidores pendientes en ../session-checks.md."
  },
  "servers": [
    {
      "url": "https://auth.internal.example.invalid:3443"
    }
  ],
  "security": [
    {
      "ServiceBearer": []
    }
  ],
  "paths": {
    "/internal/v1/sessions/check": {
      "post": {
        "operationId": "checkSession",
        "security": [
          {
            "ServiceBearer": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/SessionPair"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Resultado autoritativo al evaluar",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SessionResult"
                }
              }
            }
          },
          "400": {
            "description": "Entrada inválida",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/malformed-request"
                        },
                        "status": {
                          "const": 400
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            }
          },
          "401": {
            "description": "Credencial inválida",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/invalid-service-credentials"
                        },
                        "status": {
                          "const": 401
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              },
              "WWW-Authenticate": {
                "schema": {
                  "type": "string"
                },
                "description": "Bearer challenge sin datos sensibles"
              }
            }
          },
          "403": {
            "description": "Permiso insuficiente",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/service-forbidden"
                        },
                        "status": {
                          "const": 403
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            }
          },
          "413": {
            "description": "Cuerpo demasiado grande",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/request-too-large"
                        },
                        "status": {
                          "const": 413
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            }
          },
          "429": {
            "description": "Límite excedido; Retry-After en segundos",
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              },
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            },
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/service-rate-limited"
                        },
                        "status": {
                          "const": 429
                        }
                      }
                    }
                  ]
                }
              }
            }
          },
          "503": {
            "description": "Indisponibilidad temporal, no revocación",
            "content": {
              "application/problem+json": {
                "schema": {
                  "allOf": [
                    {
                      "$ref": "#/components/schemas/Problem"
                    },
                    {
                      "type": "object",
                      "properties": {
                        "type": {
                          "const": "/problems/session-check-unavailable"
                        },
                        "status": {
                          "const": 503
                        }
                      }
                    }
                  ]
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                },
                "description": "no-store"
              }
            }
          }
        },
        "description": "Semántica normativa: ../session-checks.md"
      }
    },
    "/internal/v1/sessions/check-batch": {
      "post": {
        "operationId": "checkSessionBatch",
        "security": [
          {
            "ServiceBearer": []
          }
        ],
        "requestBody": {
